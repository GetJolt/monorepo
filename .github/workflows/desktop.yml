# Builds the desktop installers on each platform's own runner, since electron-builder can't cross-build them.
# Pushing a desktop-v* tag also publishes them as a GitHub release, which the website links to and the app
# updates from. Running it by hand only builds, and leaves the files as workflow artifacts.
name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@getjolt/desktop^...
      - run: pnpm --filter @getjolt/desktop release
      - uses: actions/upload-artifact@v4
        with:
          name: jolt-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Jolt ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          make_latest: true
